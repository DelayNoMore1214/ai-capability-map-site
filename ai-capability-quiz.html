l4:{title:'L4 · 业务赋能能力',label:'L4 业务赋能 · 分层测验',color:'#059669',desc:'检验场景判断、流程改造、ROI、知识管理、自动化与组织落地。',questions:[
['场景选择','最适合优先做 AI 试点的业务场景通常具备什么特征？',O('频次高、基线清楚、数据可得、风险可控','完全无流程且责任不明','一年只发生一次','价值无法衡量'),'A','高频、可测、数据可用且风险可控的场景更容易形成快速反馈和可信 ROI。'],
['客服','AI 客服的正确升级机制是？',O('永不转人工','按意图、置信度、用户情绪与风险触发人工接管，并携带上下文','每轮都转人工','只在用户投诉后保存记录'),'B','升级策略应结合任务风险和质量信号，同时无缝传递上下文，避免用户重复描述。'],
['知识管理','企业知识问答持续答错旧政策，根因最可能在哪？',O('网页颜色','知识源治理、版本、权限或索引更新链路','用户名字太短','模型温度不够高'),'B','企业 RAG 的核心不仅是检索算法，还包括内容所有权、版本、权限、更新与删除传播。'],
['流程自动化','AI + RPA 方案中，AI 更适合负责什么？',O('所有确定性点击动作','非结构化理解与判断，确定性步骤由规则/RPA 执行','绕过业务权限','删除审计日志'),'B','把概率性判断与确定性执行拆开，能提高可控性、可测试性与故障定位能力。'],
['ROI','计算 AI 项目 ROI 时，哪项必须计入总成本？',O('只有 API Token','集成、人工复核、监控、失败损失、变更管理与推理成本','只有研发工资','只有服务器采购'),'B','端到端 TCO 包含建设、运行、治理和失败成本，忽略人工复核与变更管理会高估 ROI。'],
['价值验证','PoC 准确率很高但业务 KPI 没改善，下一步应做什么？',O('扩大宣传','检查流程采用率、瓶颈迁移与指标因果链','立刻换模型','删除基线数据'),'B','模型指标只是中间指标；要验证员工是否采用、瓶颈是否移动、业务结果是否由该功能带来。'],
['组织变革','推动团队采用 AI 的有效机制是？',O('只买账号','明确场景负责人、培训、反馈渠道、使用规范和可见的成功案例','强制所有任务使用 AI','隐藏失败案例'),'B','采用率来自能力、动机、流程和治理共同作用，需要场景 owner 与持续反馈。'],
['商业化','设计 AI 产品套餐与定价时，最完整的依据是？',O('竞争对手价格除以二','客户价值与支付意愿、用量边界、推理/工具/人工/支持成本以及目标毛利','模型参数量','生成的 Token 越多价格越高'),'B','商业化要同时验证价值捕获和单位经济，并让套餐边界、用量、服务等级与客户成功路径相互匹配。']],
tasks:['选择一个部门流程，画出现状与 AI 后流程，并量化节省时长、返工率、风险成本和采用率。','为一个 AI 产品制作三档套餐与单位经济表，并规划从试用、激活到续费扩张的 90 天路径。'],sources:[['OpenAI 企业评测框架','https://openai.com/index/evals-drive-next-chapter-of-ai/'],['OpenAI · 工作流机会优先级','https://academy.openai.com/public/clubs/champions-ecqup/resources/workflow-discovery-and-prioritization-matrix-2026-05-05'],['NIST AI RMF','https://www.nist.gov/itl/ai-risk-management-framework']]},
l5:{title:'L5 · 个人提效能力',label:'L5 个人提效 · 分层测验',color:'#db2777',desc:'检验搜索核验、文档协作、会议管理、学习与决策辅助。',questions:[
['AI 搜索','用 AI 做行业调研时，最可靠的流程是？',O('只读生成摘要','先定义问题，追溯一手来源，交叉核验并记录日期与不确定性','只看引用数量','把最新等同于最可靠'),'B','AI 可加速搜集和综合，但关键事实仍需回到一手来源并记录时效。'],
['事实核验','AI 给出一项可能变化的价格或法规时，应怎么做？',O('凭语气判断','查看权威原文、发布日期与适用范围','让同一模型再说一次','删掉日期'),'B','时效性事实必须用当前权威来源校验，重复生成并不构成独立证据。'],
['文档写作','用 AI 写 PRD 的最佳分工是？',O('AI 决定目标和优先级','人定义目标与取舍，AI 辅助结构化、反例检查和表达','AI 直接发布','只让 AI 改字体'),'B','责任判断留在人，AI 适合发散、整理、审阅与改写。'],
['会议管理','AI 会议纪要进入任务系统前，最重要的检查是？',O('表情符号数量','决策、负责人、截止时间和原话是否准确，并由参会者确认','摘要越长越好','是否用了最贵模型'),'B','行动项错误会直接影响协作，应让责任人确认而不是把自动摘要当事实记录。'],
['隐私','处理含客户隐私的材料时，正确做法是？',O('上传到任意免费工具','按组织政策选择获批工具，最小化/脱敏数据并检查保留设置','删除文件名即可','只在提示词中写“保密”'),'B','“提示保密”不是控制措施；工具审批、最小化、脱敏、权限和保留策略才是。'],
['学习','用 AI 学新概念，哪种方式更能检验真实掌握？',O('让 AI 反复总结','先自己解释和做题，再让 AI 追问、纠错并迁移到新案例','收藏更多链接','只读最短答案'),'B','主动回忆、生成解释、反馈和迁移练习比被动阅读更能暴露理解缺口。'],
['决策','AI 给出商业建议后，人应该重点补充什么？',O('更有自信的语气','目标权重、约束、利益相关者、不可量化因素与责任判断','更多形容词','隐藏反对证据'),'B','AI 可生成选项与分析，但决策需要显式价值权重、组织语境和责任承担。'],
['效率衡量','判断 AI 是否真的提效，应该比较什么？',O('生成字数','同等质量下的端到端完成时间、返工率与认知负担','使用次数','提示词长度'),'B','局部生成更快可能带来更多核验与返工，必须看端到端质量调整后的效率。']],
tasks:['挑一份本周交付物，记录不用 AI 与使用 AI 的总时长、核验时长、返工次数和质量评分。','做一次带出处的竞品调研：至少 5 个一手来源，逐条标注发布日期、主张和证据强度。'],sources:[['NIST GenAI Profile','https://www.nist.gov/itl/ai-risk-management-framework'],['OpenAI 评测框架','https://openai.com/index/evals-drive-next-chapter-of-ai/']]},
l6:{title:'L6 · 副业变现能力',label:'L6 副业变现 · 分层测验',color:'#ea580c',desc:'检验需求验证、定价、交付、数据权益、单位经济与可持续增长。',questions:[
['需求验证','做 AI 副业产品前，最有价值的早期证据是？',O('朋友说很酷','目标客户愿意为一个具体痛点试用、预付或投入迁移成本','生成了漂亮 Logo','模型排行榜上升'),'B','真实行为比口头兴趣更强，预付、试点承诺或持续投入能验证痛点与付费意愿。'],
['定位','AI 服务最可持续的卖点通常是？',O('使用了某个热门模型','为明确人群交付可量化结果与可靠服务','提示词数量最多','完全无人负责'),'B','模型会快速同质化，场景理解、交付结果、数据/流程积累和信任更能形成差异化。'],
['定价','调用成本波动明显的 SaaS，合理定价方式是？',O('永久免费且不限量','价值分层 + 用量边界，并监控毛利与异常消耗','只按代码行收费','永不调整套餐'),'B','定价要同时反映客户价值和单位经济，设置用量、限额与超额规则控制尾部风险。'],
['数据权益','客户提供材料用于生成内容时，合同至少应明确什么？',O('只写模型名称','数据使用目的、权限、保留/删除、输出权利与第三方条款','网页主题色','提示词长度'),'B','输入、训练/改进用途、输出与第三方服务条款都可能影响权利和责任边界。'],
['内容变现','批量生成自媒体内容的最大长期风险是？',O('产量不够高','低差异化、事实/版权风险与平台信任下降','标题不够长','没有使用多 Agent'),'B','低成本生成不等于长期价值；编辑判断、原创证据、版权与受众信任决定可持续性。'],
['服务交付','AI 咨询项目应该如何定义验收？',O('交付提示词文件即可','以业务结果、样本评测、边界、培训和运维责任形成可验证标准','客户说“感觉不错”','只保证模型永不出错'),'B','可验收交付需要目标、样本、阈值、例外处理和双方责任，不能只交付工具。'],
['自动化服务','Agent 自动化服务上线前，最关键的商业技术指标是？',O('总注册数','每个成功任务的收入、全成本与错误赔付/人工兜底','模型参数量','页面访问时长'),'B','按成功任务核算收入与完整成本，才能看清毛利和失败尾部风险。'],
['规模化','从定制项目走向产品化，优先标准化什么？',O('所有客户的品牌色','重复出现的工作流、输入规范、评测、异常处理和交付边界','销售话术中的形容词','创始人个人时间'),'B','把重复交付模块化并明确例外边界，才能降低边际成本且维持质量。']],
tasks:['为一个 AI 副业写单位经济表：客单价、获客、推理、人工复核、工具、退款/赔付与毛利。','访谈 5 位目标用户，用“现有替代方案、发生频次、损失、预算、决策人”验证需求，禁止只问“你想不想要”。'],sources:[['NIST GenAI Profile','https://www.nist.gov/itl/ai-risk-management-framework'],['欧盟 AI 透明度指南','https://digital-strategy.ec.europa.eu/en/news/commission-publishes-guidelines-transparency-obligations-providers-and-deployers-certain-ai-systems']]}
};
const label=document.getElementById('label'),title=document.getElementById('title'),description=document.getElementById('description'),tabs=document.getElementById('tabs'),questions=document.getElementById('questions'),tasks=document.getElementById('tasks'),sources=document.getElementById('sources'),score=document.getElementById('score'),status=document.getElementById('status'),reset=document.getElementById('reset');
const letters=['A','B','C','D'];let layer=new URLSearchParams(location.search).get('layer');if(!bank[layer])layer='l1';let saved={};const key='ai-capability-quiz-'+layer;try{saved=JSON.parse(localStorage.getItem(key))||{}}catch(e){}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const d=bank[layer];document.documentElement.style.setProperty('--layer',d.color);document.title=d.title+' — AI 能力地图';label.textContent=d.label;title.textContent=d.title;description.textContent=d.desc;tabs.innerHTML=Object.entries(bank).map(([id,x])=>`<a class="layer-tab ${id===layer?'active':''}" href="?layer=${id}">${id.toUpperCase()} ${x.title.split('·')[1].trim()}</a>`).join('');questions.innerHTML=d.questions.map((q,i)=>`<div class="question" data-id="${i}"><div class="q-meta">${esc(q[0])} · ${i+1}/8</div><div class="q-text">Q${i+1}. ${esc(q[1])}</div><div class="options">${q[2].map((x,j)=>`<div class="option" data-v="${letters[j]}"><span class="radio"></span>${letters[j]}) ${esc(x)}</div>`).join('')}</div><div class="feedback"></div></div>`).join('');tasks.innerHTML=d.tasks.map((x,i)=>`<div class="task"><div class="task-title">T${i+1}. 实践任务</div><div class="task-desc">${esc(x)}</div></div>`).join('');sources.innerHTML='<strong>校准来源（截至 2026-08-17）：</strong> '+d.sources.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join(' · ');bind();scoreNow()}
function show(q,selected,restore=false){const idx=+q.dataset.id,answer=bank[layer].questions[idx][3],summary=bank[layer].questions[idx][4],ok=selected===answer;q.classList.add(ok?'correct':'wrong');q.querySelectorAll('.option').forEach(o=>{if(o.dataset.v===selected)o.classList.add('selected');if(o.dataset.v===answer)o.classList.add('correct-answer');if(o.dataset.v===selected&&!ok)o.classList.add('wrong-answer')});const f=q.querySelector('.feedback');f.className='feedback show '+(ok?'correct':'wrong');f.innerHTML=`<strong>${ok?'CORRECT':'WRONG · 正确答案是 '+answer}</strong><span class="summary">${esc(summary)}</span>`;if(!restore){saved[idx]={selected,ok};localStorage.setItem(key,JSON.stringify(saved));scoreNow()}}
function bind(){document.querySelectorAll('.question').forEach(q=>{const v=saved[q.dataset.id];if(v){show(q,v.selected,true);return}q.querySelectorAll('.option').forEach(o=>o.addEventListener('click',()=>{if(saved[q.dataset.id])return;show(q,o.dataset.v)}))})}
function scoreNow(){const vals=Object.values(saved),correct=vals.filter(x=>x.ok).length,total=bank[layer].questions.length;score.textContent=correct+'/'+total;status.className='score-status '+(vals.length===0?'':correct>=6?'pass':'review');status.textContent=vals.length===0?'PENDING':vals.length<total?'IN PROGRESS':correct===total?'PERFECT':correct>=6?'PASS':'REVIEW'}
reset.addEventListener('click',()=>{saved={};localStorage.removeItem(key);render()});render();
</script>
