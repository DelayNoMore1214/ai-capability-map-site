*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}.nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}.nav-inner{max-width:800px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px}.nav-back,.nav-title{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase}.nav-back{color:var(--interactive);text-decoration:none;padding:6px 12px;border:1px solid rgba(0,122,255,.2);border-radius:6px}.nav-title{color:var(--secondary)}.main{max-width:720px;margin:auto;padding:40px 20px 80px}.page-header{margin-bottom:24px}.label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--disabled);margin-bottom:6px}.page-header h1{font-size:28px;line-height:1.25;color:var(--display);margin-bottom:7px}.page-header p{font-size:14px;color:var(--secondary)}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.meta span{font-family:'Space Mono',monospace;font-size:9px;padding:3px 9px;border:1px solid var(--border-visible);border-radius:4px;color:var(--secondary);background:#fff}
.total,.layer,.practice,.resources{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}.total{padding:16px 20px}.progress-label,.layer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.progress-label span,.layer-count{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.05em;color:var(--secondary)}.progress-label strong{font-family:'Space Mono',monospace;font-size:12px}.bar{display:flex;gap:2px}.seg{height:6px;flex:1;background:var(--border);transition:.2s}.seg.filled{background:var(--layer)}.badge{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:3px;color:var(--layer);border:1px solid var(--layer);background:var(--layer-soft)}
.item{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;margin-bottom:2px;transition:.15s}.item:hover{background:var(--raised)}.check{width:16px;height:16px;margin-top:3px;border:1.5px solid var(--border-visible);border-radius:2px;flex:none;position:relative}.item.checked .check{border-color:var(--success);background:var(--success)}.item.checked .check:after{content:'';position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}.item.checked .item-title{text-decoration:line-through;color:var(--disabled)}.item-title{font-size:14px;font-weight:500}.item-desc{font-size:12px;color:var(--secondary);margin-top:2px;line-height:1.5}.item-detail{cursor:default;align-items:center;border:1px solid transparent;margin:5px 0}.item-detail:hover{border-color:var(--border);background:#fafafa}.item-detail.checked .item-title{text-decoration:none;color:var(--text)}.item-copy{min-width:0;flex:1}.item-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:7px}.item-time,.item-status{font-family:'Space Mono',monospace;font-size:9px}.item-time{color:var(--disabled)}.item-status{color:var(--secondary)}.item.checked .item-status{color:var(--success)}.item-link{flex:none;font-family:'Space Mono',monospace;font-size:9px;text-decoration:none;color:var(--interactive);border:1px solid rgba(0,122,255,.24);border-radius:4px;padding:5px 8px}.item-link:hover{background:rgba(0,122,255,.06)}.section-title{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--secondary);margin-bottom:4px}.section-desc{font-size:12px;color:var(--disabled);margin-bottom:14px}.task{padding:12px 14px;border:1px dashed var(--border-visible);border-radius:6px;margin-top:10px}.task-title{font-family:'Space Mono',monospace;font-size:10px;color:var(--layer);margin-bottom:4px}.task p{font-size:13px}.resource-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.resource-list a{font-family:'Space Mono',monospace;font-size:10px;color:var(--interactive);text-decoration:none;padding:4px 9px;border:1px solid rgba(0,122,255,.2);border-radius:4px}.resource-list a:hover{background:rgba(0,122,255,.06)}.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.pager a{background:#fff;border:1px solid var(--border);border-radius:8px;padding:11px 13px;text-decoration:none;color:var(--secondary);font-size:11px}.pager a:last-child{text-align:right}.pager strong{display:block;color:var(--text);font-size:12px;margin-top:2px}.reset{width:100%;margin-top:14px;background:none;border:0;color:var(--disabled);font-family:'Space Mono',monospace;font-size:10px;cursor:pointer}.reset:hover{color:#d71921}.footer{text-align:center;padding:36px 20px;font-family:'Space Mono',monospace;font-size:10px;color:var(--disabled)}
@media(max-width:600px){.main{padding:28px 14px 60px}.page-header h1{font-size:24px}.layer,.practice,.resources{padding:15px}.item-detail{align-items:flex-start;flex-wrap:wrap}.item-detail .item-link{margin-left:26px}.pager{grid-template-columns:1fr}.pager a:last-child{text-align:left}}

<script>
const E=(title,desc)=>({title,desc});
const P=(layer,title,desc,weeks,concepts,practice,delivery,tasks,resources)=>({layer,title,desc,weeks,phases:[concepts,practice,delivery],tasks,resources});
const R={map:['能力地图资源区','ai-capability-map.html#resources'],quiz:['完成分层测验','ai-capability-quiz.html'],pg:['提示工程指南','https://www.promptingguide.ai/zh'],dc:['Deep Dive Claude Code','https://deep-dive-claude-code.vercel.app/'],lc:['LangChain 文档','https://docs.langchain.com/oss/python/langchain/overview'],dsh:['DeepSeek Harness','https://github.com/deepseek-ai/deepseek-harness'],dshArch:['DeepSeek Harness 架构','deepseek-harness/docs/architecture.zh.md'],nist:['NIST AI RMF','https://www.nist.gov/itl/ai-risk-management-framework'],eu:['EU AI Act','https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai']};
const paths={
'l1-history':P('L1','AI 发展简史与关键里程碑','建立从 Transformer 到多模态与 Agent 的技术演进坐标，能区分真正的范式变化与短期热点。','1 周',[E('Transformer 与预训练范式','理解注意力、规模化预训练为何改变通用 AI。'),E('对话模型与后训练','梳理指令微调、偏好对齐和推理模型的产品意义。')],[E('多模态能力演进','比较文本、图像、语音、视频能力进入产品的顺序与边界。'),E('Agent 从聊天走向行动','理解工具调用、环境反馈与长任务为何构成新阶段。')],[E('制作 AI 技术时间轴','为每个里程碑标注能力跃迁、成本变化与代表产品。'),E('建立技术信号雷达','用证据强度、成熟度和业务影响评估一个新趋势。')],['输出一张 2017—2026 AI 技术与产品里程碑图。','选择一个热门概念，写出“事实、推断、营销话术”三栏判断。'],[R.map,R.pg]),
'l1-principles':P('L1','大模型核心原理（非技术版）','不写训练代码，也能解释模型为什么会生成、为什么会幻觉，以及上下文、参数和推理成本如何影响产品。','1–2 周',[E('Token、Embedding 与注意力','用产品语言解释模型如何读取和关联信息。'),E('预训练、后训练与推理','分清更新权重、对齐行为与实际生成三个阶段。')],[E('上下文窗口与记忆','理解可见信息、外部记忆和跨会话状态的区别。'),E('采样与不确定性','观察温度、结构化输出和约束如何影响稳定性。')],[E('幻觉成因与缓解','从知识缺失、上下文噪声和任务歧义定位问题。'),E('向团队讲清模型边界','制作一页非技术原理图并接受研发校正。')],['用 5 个生活类比分别解释 Token、注意力、参数、上下文和推理。','用同一提示测试三组参数设置，记录稳定性与成本变化。'],[R.pg,R.map]),
'l1-selection':P('L1','模型选型与成本评估','用真实任务而非排行榜完成模型选型，平衡质量、延迟、成本、部署与合规。','1–2 周',[E('选型约束框架','明确业务目标、风险等级、数据边界和上线门槛。'),E('模型与部署类型','理解闭源/开源、通用/垂直、云端/本地的取舍。')],[E('构建代表性评测集','从真实流量抽样并覆盖关键边界和高代价失败。'),E('端到端成本测算','计算输入输出 Token、工具、缓存、人工复核与运维成本。')],[E('质量—延迟—成本实验','用同一批样本比较至少两种模型配置。'),E('形成选型决策记录','写清结论、证据、风险、回退方案与复评时间。')],['完成一份两模型对比表，至少包含 30 条真实样本。','计算月请求量从 1 万增长到 100 万时的成本敏感性。'],[R.map,R.nist]),
'l1-infra':P('L1','算力与基础设施认知','理解 AI 产品背后的算力、推理服务、缓存与沙箱，让容量、成本和安全讨论可落地。','1–2 周',[E('GPU、显存与吞吐','理解模型大小、并发、延迟和硬件资源的基本关系。'),E('推理服务链路','梳理网关、调度、模型服务、缓存与监控。')],[E('量化、蒸馏与投机解码','理解常见优化方法的收益和质量风险。'),E('云端、本地与边缘部署','比较数据、弹性、成本和运维复杂度。')],[E('容量与故障设计','定义限流、超时、重试、降级和灾备策略。'),E('基础设施评审','能看懂一张端到端架构图并指出成本与单点。')],['为一个日均 10 万次调用的功能画推理链路图。','向研发确认 P50/P95 延迟、并发上限、降级和容量冗余。'],[R.map,R.dshArch]),
'l1-trends':P('L1','AI 趋势追踪与前沿洞察','建立可持续的信息源、验证和输出机制，避免被发布会、榜单与社交媒体噪声牵着走。','持续进行',[E('信息源分级','区分论文、官方文档、代码、评测、媒体和二手解读。'),E('信号与噪声','用可复现性、采用度和商业影响判断证据强度。')],[E('技术成熟度评估','从实验能力、工程可用性、治理与生态四层判断。'),E('建立个人技术雷达','按观察、试验、采用、暂缓维护主题。')],[E('月度前沿简报','把变化翻译成用户、业务和路线图影响。'),E('预测复盘','记录判断与证据，定期检查命中和认知偏差。')],['建立不少于 15 个一手信息源的订阅清单。','连续四周输出一页 AI 雷达，并记录被证伪的判断。'],[R.map,R.pg]),
'l1-pm-role':P('L1','AI 时代 PM 岗位价值重塑','识别可交给 AI 的工作与必须由人负责的判断，把 AI 变成产品经理的能力杠杆。','1 周',[E('任务可替代性分析','按生成、判断、协同、责任拆解 PM 工作。'),E('人机责任边界','明确 AI 建议、人类决策和最终问责的区别。')],[E('个人 AI 工作流','重构调研、文档、数据分析和原型流程。'),E('高价值能力强化','训练用户共情、战略取舍、跨团队推动和风险判断。')],[E('建立能力基线','记录质量调整后的时间、返工率和决策效果。'),E('制定 90 天升级计划','选择三项杠杆任务与两项不可替代能力持续训练。')],['绘制自己的 PM 任务矩阵：自动化、增强、保留、停止。','选一个月度工作流做前后对比并复盘真实收益。'],[R.map,R.nist]),
'l2-prompt':P('L2','提示与上下文工程','从“写一句神奇提示词”升级为持续管理系统指令、工具、外部数据、历史、记忆和上下文预算。','1–2 周',[E('指令层级与任务定义','掌握 System、Developer、User 内容的职责与冲突处理。'),E('上下文构成与预算','识别工具定义、MCP、外部数据、消息历史和记忆如何进入推理。')],[E('结构化输出与验证','用 Schema、字段说明和业务校验获得稳定接口。'),E('检索、记忆与压缩','在有限注意力预算内保留高信号信息并控制上下文污染。')],[E('建立上下文评测集','以真实样本测试正确性、工具选择、长任务稳定性和成本。'),E('版本、观测与回归','记录指令与上下文版本、假设、Trace、结果和失败案例。')],['为一个 Agent 画出完整上下文清单，并标注来源、优先级和 Token 预算。','构建 20 条回归集，对比两种上下文策略的质量、延迟和成本。'],[R.pg,R.quiz]),
'l2-rag':P('L2','RAG 检索增强生成','掌握从知识源治理到检索、重排、生成和评测的完整链路。','2–3 周',[E('RAG 适用边界','区分需要外部知识的问题与模型推理/微调问题。'),E('文档解析与切分','理解版面、表格、语义块和元数据对召回的影响。')],[E('Embedding 与混合检索','比较向量、关键词、过滤和查询改写。'),E('重排序与上下文组装','提高证据精度并控制上下文噪声和成本。')],[E('端到端 RAG 评测','分别测召回、引用忠实度和任务解决率。'),E('知识运营','设计权限、版本、更新、删除传播和内容责任人。')],['用 20 份文档搭建最小 RAG，并保存 30 条评测问题。','针对五个失败案例判断问题发生在解析、召回、重排还是生成。'],[R.lc,R.pg,R.quiz]),
'l2-multimodal':P('L2','多模态能力应用','理解文本、图像、语音和视频的输入输出边界，设计真正跨模态的产品链路。','2 周',[E('模态能力地图','梳理理解、生成、编辑、识别和实时交互能力。'),E('输入质量与表示','理解分辨率、帧、音频质量和上下文对效果的影响。')],[E('跨模态提示与评测','为图像、语音和视频定义任务与评分标准。'),E('延迟与成本实验','比较实时、异步、流式和批处理方案。')],[E('版权、隐私与标识','处理素材权利、人物同意和生成内容披露。'),E('设计多模态 Demo','完成上传/采集、处理、结果、修正和导出闭环。')],['用同一业务任务测试图像理解与人工基线。','设计一个语音或视频功能，标注延迟预算、失败兜底和合规提示。'],[R.map,R.nist]),
'l2-finetune':P('L2','模型微调与定制（LoRA / Fine-tuning）','知道何时该微调、如何准备数据，以及如何证明定制模型真的优于提示或 RAG。','2–4 周',[E('微调适用边界','区分行为/风格学习、知识更新与工具接入问题。'),E('SFT、LoRA 与偏好优化','理解不同方法的目标、成本与风险。')],[E('数据集设计','建立任务定义、样本分布、清洗、标注和切分规则。'),E('训练与实验管理','记录基座、超参、版本、成本和可复现条件。')],[E('基线与回归评测','与 Prompt、RAG 和原模型在同一评测集比较。'),E('发布与回滚','定义模型版本、灰度、漂移监控和数据闭环。')],['写一份“为何需要微调而非 Prompt/RAG”的决策记录。','设计 100 条训练样本规范和 30 条独立评测样本。'],[R.pg,R.nist]),
'l2-coding':P('L2','AI 编程辅助与低代码','让产品经理能用 AI 构建、检查和迭代可运行原型，同时理解代码、安全和部署边界。','2–3 周',[E('代码与应用基本结构','理解 HTML/CSS/JS、前后端、API、数据库和部署。'),E('AI 编程任务拆解','把需求拆为可验证的小步并给出验收条件。')],[E('生成—运行—调试循环','学会读错误、提供上下文、要求最小修复并回归。'),E('版本与安全基础','使用 Git，避免密钥泄露并审查依赖和权限。')],[E('搭建可运行 Demo','完成核心流程、空状态、错误状态和移动端适配。'),E('交接研发','输出需求、架构、数据、已知限制和下一步清单。')],['独立完成一个带本地数据保存的单页产品 Demo。','让 AI 为原型生成测试清单，并亲自验证十个关键场景。'],[R.dc,R.map]),
'l2-harness':P('L2','Agent Harness 与智能体运行时','理解 Agent 的运行底盘如何组织模型、工具、会话、权限、沙箱、追踪与扩展。','2–3 周',[E('Harness 与 Agent Loop','理解一次 Turn、多个 Step、模型请求和工具结果如何循环。'),E('会话、上下文与事件日志','理解持久事实、模型可见内容、恢复与回放。')],[E('工具执行与权限管线','梳理注册、展示、调用、审批、沙箱、超时和结果处理。'),E('插件与能力扩展点','理解 DeepSeek Harness“一切皆插件”和 Cordis 可逆 effect。')],[E('配置一个运行 Profile','观察模型、工具、持久化和 UI 如何由插件树组装。'),E('设计运行时治理方案','覆盖可观测性、成本、失败恢复、最小权限和审计。')],['画出用户消息到模型、工具、会话日志和 UI 的完整数据流。','阅读扩展手册，为一个新工具选择扩展点并写 PM 级方案。'],[R.dsh,R.dshArch,R.quiz]),
'l3-strategy':P('L3','AI 产品战略与场景机会识别','在进入原型前判断用户问题、业务价值以及 AI、规则、Workflow 或 Agent 中哪种方案最合适。','1–2 周',[E('用户任务与工作流发现','从真实角色、目标、阻力、例外和现有替代方案理解问题。'),E('AI 适用性判断','区分确定性规则、生成式能力和自主 Agent 各自适用的复杂度。')],[E('机会价值与可行性','评估频次、覆盖、收益、数据准备、系统依赖和治理要求。'),E('场景优先级矩阵','用价值、实现难度、风险与学习价值排列机会。')],[E('产品组合与路线图','平衡短期 Quick Win、基础能力和长期差异化。'),E('建立停止条件','明确何时不做 AI、暂停 PoC 或回到确定性方案。')],['访谈五位目标用户，输出当前工作流、关键例外和未满足需求。','为三个候选场景完成 AI/规则/Workflow/Agent 决策与优先级评审。'],[R.map,R.nist]),
'l3-design':P('L3','AI 产品设计方法论','围绕概率性输出设计可理解、可控制、可恢复的用户体验。','2 周',[E('概率性产品思维','区分确定性规则、模型建议与自主执行。'),E('能力边界与用户心智','明确产品会做、不会做、何时失败和谁负责。')],[E('AI 交互状态','设计生成中、引用、低置信、失败、重试、撤销和接管。'),E('人在回路','按风险决定确认、审核、覆盖和升级机制。')],[E('端到端服务蓝图','连接 UI、模型、数据、工具和运营流程。'),E('信任与反馈闭环','让用户能核验、纠错并理解系统改进方式。')],['重画一个现有 AI 功能的正常、失败和人工接管流程。','用五位用户测试他们是否理解 AI 的能力边界。'],[R.nist,R.map]),
'l3-data-flywheel':P('L3','AI 数据策略与反馈飞轮','规划数据来源、权利、质量和生命周期，并把真实使用中的纠错与 Trace 变成持续改进资产。','2–3 周',[E('数据资产与权利地图','梳理输入、知识、行为、反馈和评测数据的来源、授权与责任人。'),E('数据质量与版本','定义完整性、准确性、时效、偏差、血缘和变更规则。')],[E('反馈采集设计','把显式评价、用户修改、人工接管和任务结果转成结构化信号。'),E('Trace 到 Eval','从生产失败抽样、脱敏、标注并沉淀为稳定回归集。')],[E('改进闭环与实验','将问题路由到提示、检索、工具、模型、交互或流程并验证改动。'),E('飞轮治理','控制反馈滥用、隐私、代表性偏差和自动优化风险。')],['为一个 AI 功能画出“生产使用→反馈→评测→改进→灰度”的数据飞轮。','从 20 条模拟生产 Trace 中提炼失败分类和 10 条回归样本。'],[R.nist,R.map]),
'l3-eval':P('L3','AI 产品评估与测试','把“感觉不错”变成可重复、可解释、能支撑上线决策的评测体系。','2–3 周',[E('目标与失败分类','把业务要求转成质量、安全、鲁棒和成本指标。'),E('评测集与金标','覆盖真实分布、边界案例和高代价失败。')],[E('规则、人工与模型评分','为不同指标选择确定性检查、专家或 LLM Judge。'),E('红队与对抗测试','测试提示注入、越权、隐私、偏见和滥用。')],[E('上线阈值与灰度','定义离线门槛、线上护栏、回滚和扩量条件。'),E('持续回归与漂移','从生产失败扩充数据集并监控版本退化。')],['为一个 AI 功能制作不少于 50 条的分层评测集。','输出一页上线评分卡，写明阈值、红线和回滚条件。'],[R.nist,R.quiz]),
'l3-security':P('L3','AI / Agent 安全与权限治理','从产品需求层定义 Agent 身份、授权、工具边界和事故响应，让自主能力始终处于可控范围。','2–3 周',[E('Agent 威胁建模','识别目标劫持、提示注入、工具滥用、数据外泄和供应链风险。'),E('身份、授权与最小权限','明确用户、Agent、服务账户、资源与每次动作的授权关系。')],[E('输入输出与工具防线','设计不可信内容隔离、参数校验、域名/资源限制和执行沙箱。'),E('人在回路与可逆性','按影响和可撤销程度设置审批、幂等、回滚和限额。')],[E('审计与不可抵赖','记录请求者、授权、工具参数、结果、版本和关键决策。'),E('安全事件响应','建立发现、阻断、隔离、通知、恢复和复盘流程。')],['为一个能发邮件或修改数据的 Agent 完成威胁模型和权限矩阵。','模拟一次间接 Prompt Injection，设计检测、审批、阻断和审计证据。'],[R.nist,R.dshArch]),
'l3-compliance':P('L3','AI 合规与伦理','把法律、伦理与公司政策转化为产品需求、流程证据和上线门禁。','2–3 周',[E('适用范围与角色','识别地区、用户、场景以及提供者/部署者责任。'),E('风险分级','按用途、影响对象、自动化程度和可逆性定级。')],[E('数据与内容权利','覆盖隐私、训练数据、版权、肖像与商业秘密。'),E('透明度与用户权利','设计 AI 告知、生成标识、解释、申诉和人工介入。')],[E('合规控制矩阵','把义务映射到产品、技术、运营和法务负责人。'),E('证据与事件响应','保留评测、日志、版本和决策记录，设计事故流程。')],['为一个跨地区 AI 功能完成风险与义务清单。','模拟一次有害输出事件，写通知、止损、调查和复盘步骤。'],[R.eu,R.nist]),
'l3-operations':P('L3','AI 上线运营与持续监控','把上线后的功能、运行、人因、安全、合规和影响信号组织成持续运营与改进机制。','2–3 周',[E('生产监控模型','定义功能、运行、人因、安全、合规和大范围影响六类监控。'),E('服务目标与版本基线','建立质量、P95 延迟、可用性、成本、模型和提示版本基线。')],[E('漂移与异常检测','监控输入分布、任务成功、人工接管、拒绝、越权和费用异常。'),E('告警、降级与回滚','为不同严重度设计自动阻断、能力降级、供应商切换和恢复条件。')],[E('事故与供应商运营','建立 SLA、值守、通知、根因、赔付和第三方变更管理。'),E('生产反馈复盘','把线上问题转成评测、路线图和治理改进。')],['为一个 AI 功能制作上线监控看板与告警分级表。','演练一次模型版本退化事故，输出发现、降级、回滚和复盘记录。'],[R.nist,R.map]),
'l3-analytics':P('L3','AI 产品数据分析','建立质量、行为、成本和商业结果相连接的 AI 产品指标体系。','1–2 周',[E('指标树与因果链','从业务结果拆到任务成功、质量、采用与成本。'),E('AI 特有事件模型','定义请求、响应、工具、反馈、拒绝、升级和 Token 事件。')],[E('质量与成本看板','监控成功率、延迟、单位成本、失败类型和版本。'),E('实验与分群','按用户、任务、模型和版本分析差异。')],[E('线上线下联动','把离线评测与真实行为、人工复核结果对齐。'),E('迭代决策机制','用数据决定修提示、检索、模型、交互还是流程。')],['画一棵 AI 功能指标树并定义每个指标口径。','用模拟数据制作质量—成本—留存三联看板。'],[R.map,R.nist]),
'l3-prototype':P('L3','原型与 Demo 快速构建','用最小可运行产品验证用户价值和关键技术风险，而不是只展示漂亮界面。','1–2 周',[E('验证假设与范围','明确 Demo 要证伪的用户、价值和技术假设。'),E('原型层级选择','在流程图、可点击原型、Wizard-of-Oz 和真模型 Demo 间选择。')],[E('AI 辅助构建','用提示拆解页面、状态、数据和核心交互。'),E('模拟与真实能力边界','清楚标注假数据、人工操作和真实模型链路。')],[E('用户任务测试','观察完成率、理解、信任和失败恢复。'),E('形成研发输入','沉淀需求、证据、架构假设、风险与优先级。')],['72 小时内完成一个可运行 Demo 并测试五位目标用户。','整理“已验证、未验证、被证伪”三栏结论。'],[R.map,R.dc]),
'l4-service':P('L4','AI 客服与智能助手','设计从意图识别、知识检索到人工升级和质检运营的服务闭环。','2–3 周',[E('服务场景与意图体系','按频次、价值、风险和可自动化程度选择范围。'),E('知识与对话链路','理解检索、多轮澄清、引用与上下文。')],[E('升级与人工协同','按置信、风险、情绪和用户请求触发接管。'),E('安全与身份校验','防止越权查询、敏感信息泄露和错误承诺。')],[E('客服评测与运营','监控解决率、转人工、重复咨询、满意度和成本。'),E('灰度与持续优化','从小意图集上线，闭环失败案例和知识更新。')],['为 100 条历史工单建立意图与风险标注。','设计机器人到人工的上下文交接卡片和 SLA。'],[R.lc,R.nist]),
'l4-marketing':P('L4','AI 营销内容生成','建立兼顾品牌一致性、生产效率、事实版权和渠道效果的 AIGC 工作流。','2 周',[E('营销目标与内容链路','从受众、洞察、创意到分发和转化定义任务。'),E('品牌与事实约束','建立语气、禁用词、声明、素材和事实来源规范。')],[E('多模态生产流程','组合文案、图像、语音和视频的生成与审核。'),E('模板化与批量变体','用结构化输入生成可追踪的渠道版本。')],[E('内容评测与实验','结合人工 rubric、品牌检查和 A/B 指标。'),E('版权与声誉治理','处理素材授权、相似性、标识和危机响应。')],['为一个活动制作品牌 Prompt Kit 和十组渠道变体。','设计生成、事实核验、品牌审核、发布与复盘流程。'],[R.pg,R.nist]),
'l4-bi':P('L4','AI 数据分析与商业智能','让自然语言分析建立在正确指标、可信数据和可复现查询之上。','2–3 周',[E('语义层与指标口径','理解表、字段、业务指标和权限是问数基础。'),E('NL2SQL 风险','识别歧义、错误关联、时间口径和越权查询。')],[E('查询—执行—解释链路','要求 SQL、结果和结论可追溯并可验证。'),E('图表与叙事生成','根据问题选择合适可视化并避免过度结论。')],[E('数据 Agent 评测','用金标 SQL、结果集和业务解释多层评分。'),E('决策闭环','把洞察连接到负责人、动作、结果和复盘。')],['建立 30 条业务问数金标集及其指标口径。','让数据 Agent 分析一项异常，并人工复核 SQL 与结论。'],[R.nist,R.map]),
'l4-knowledge':P('L4','AI 知识管理','把分散文档变成有所有者、有权限、有版本、可检索和可更新的知识系统。','2–3 周',[E('知识盘点与分类','识别来源、用户、敏感度、时效和权威层级。'),E('知识生命周期','定义创建、审核、发布、更新、归档和删除。')],[E('解析、检索与权限','确保内容结构、元数据和访问控制进入检索链路。'),E('知识图谱与关系','在需要实体关系和跨文档推理时评估 GraphRAG。')],[E('质量运营','监控无答案、过期引用、错误答案和反馈闭环。'),E('组织责任机制','明确内容 owner、更新 SLA 和争议处理。')],['为一个部门建立知识源清单、owner 和更新 SLA。','用 30 个真实问题评估知识覆盖、召回与引用准确率。'],[R.lc,R.map]),
'l4-automation':P('L4','AI 流程自动化（AI + RPA）','把概率性理解与确定性执行组合成可控、可回滚、可审计的端到端流程。','2–3 周',[E('流程发现与适用性','选择高频、可量化、规则稳定且风险可控的流程。'),E('AI 与 RPA 分工','AI 处理非结构化理解，规则/RPA 负责确定性动作。')],[E('异常、幂等与补偿','设计重试、去重、回滚、人工队列和超时。'),E('权限与凭证','采用最小权限、凭证隔离和关键动作审批。')],[E('流程级评测','测直通率、异常率、人工时长、错误损失和成本。'),E('从试点到规模化','标准化连接器、监控、版本和变更管理。')],['绘制一个现状流程和 AI 后流程，标出每个责任主体。','实现或模拟一个含人工审批和失败回滚的自动化 Demo。'],[R.dsh,R.nist]),
'l4-dev':P('L4','AI 辅助研发效能','理解 AI 如何影响需求、编码、评审、测试和运维，并用交付结果而非代码产量衡量价值。','2 周',[E('研发价值流','从需求到上线定位等待、返工和质量瓶颈。'),E('AI 编码能力边界','理解生成、解释、重构、测试和审查的适用场景。')],[E('上下文与仓库规则','让 Agent 遵循架构、测试、安全和贡献规范。'),E('评审与安全门禁','保留人类审查、自动测试、依赖和秘密扫描。')],[E('效能指标','衡量周期、返工、缺陷、评审负担和开发体验。'),E('渐进式推广','从低风险任务试点，建立范例、培训和治理。')],['选择一个研发流程，记录两周 AI 前后周期与返工。','为 Coding Agent 写任务模板、验收标准和安全边界。'],[R.dc,R.dsh]),
'l4-change':P('L4','AI 驱动的组织变革管理','让 AI 采用从“个人尝鲜”升级为目标清晰、责任明确、能力可持续的组织改变。','2–4 周',[E('变革目标与利益相关者','识别业务结果、受影响角色、阻力和支持者。'),E('工作与角色重设计','明确哪些任务自动化、增强、保留或新增。')],[E('能力与培训体系','按角色设计基础、场景、风险和实操训练。'),E('治理与心理安全','建立可试错边界、反馈渠道和透明的使用规范。')],[E('试点网络与冠军用户','用真实案例、社区和辅导推动扩散。'),E('采用与价值度量','同时看使用、能力、业务结果和风险信号。')],['为一个部门制作 AI 变革利益相关者地图。','设计 90 天试点：目标、人员、培训、治理、指标和复盘。'],[R.nist,R.map]),
'l4-value':P('L4','AI 实践落地与价值验证','把 PoC 转化为可量化、可运营、可规模化的生产能力。','2–4 周',[E('问题与基线','明确目标用户、现状流程、业务基线和不可接受风险。'),E('价值假设与 KPI','连接模型指标、用户行为和财务结果。')],[E('PoC、试点与灰度','为每阶段定义样本、范围、阈值和退出条件。'),E('TCO 与 ROI','计算建设、推理、人工、治理、失败和变更成本。')],[E('运营与责任','明确 owner、SLA、监控、升级和供应商管理。'),E('规模化决策','用证据判断扩量、调整、暂停或停止。')],['完成一个 AI 项目的基线、目标、TCO 和 ROI 模型。','制作从 PoC 到规模化的阶段门与决策材料。'],[R.nist,R.map]),
'l4-commercialization':P('L4','AI 产品商业化与增长','把 AI 能力转化为客户愿意持续付费、企业能够健康交付并可复制增长的产品。','2–4 周',[E('目标市场与价值主张','明确高价值细分客户、替代方案、可量化结果和差异化证据。'),E('购买链与采用阻力','识别用户、决策者、采购、安全、法务和实施角色。')],[E('产品包装与定价','设计套餐、能力边界、用量、超额、试用和服务等级。'),E('单位经济与毛利','测算获客、推理、工具、人工复核、支持、失败和留存成本。')],[E('GTM 与激活','连接获客、销售验证、集成、首个价值时刻和持续采用。'),E('客户成功与规模化','用留存、扩张、毛利、结果达成和支持负担决定增长节奏。')],['为一个 AI 产品制作三档套餐、定价依据和每成功任务单位经济表。','设计 90 天 GTM 与客户成功计划，写明目标客户、渠道、激活、留存和扩张指标。'],[R.map,R.nist]),
'l5-search':P('L5','AI 搜索与信息整合','用 AI 加速发现和综合，同时保留来源、时效、证据强度与独立判断。','1 周',[E('问题拆解与检索策略','把宽泛主题拆成事实、观点、数据和待验证假设。'),E('来源等级与时效','优先官方、一手和原始数据，记录发布日期。')],[E('查询迭代与交叉核验','使用不同关键词和独立来源寻找冲突证据。'),E('引用与证据表','让每个关键主张都能回到原文。')],[E('综合而非拼贴','按主题、共识、分歧和不确定性形成结论。'),E('建立可复用调研模板','沉淀问题、来源、证据和更新机制。')],['完成一份含 10 个一手来源的竞品调研。','随机抽查五条 AI 结论，记录是否被原文直接支持。'],[R.map,R.quiz]),
'l5-writing':P('L5','AI 文档与报告写作','让 AI 辅助结构、表达和审阅，但由人掌握目标、事实、取舍与最终责任。','1 周',[E('受众、目的与决策','写作前明确读者要理解、决定或执行什么。'),E('事实包与大纲','先整理证据、约束和关键结论，再生成正文。')],[E('分段协作与风格控制','逐段生成、引用来源并使用组织模板。'),E('反方审阅与事实检查','让 AI 找缺口、矛盾和反例，再人工核验。')],[E('编辑与压缩','删除空话，强化结论、依据、影响和行动。'),E('版本与反馈沉淀','把有效结构、术语和审阅意见变成模板。')],['用 AI 完成一份 PRD，但保留事实核验与人工决策记录。','对同一报告输出管理层一页版和执行团队详细版。'],[R.pg,R.map]),
'l5-meeting':P('L5','AI 会议与信息管理','把录音、纪要和行动项变成可信、可确认、可追踪的协作记录。','1 周',[E('会议目标与记录结构','会前定义决策、讨论和信息同步的产出。'),E('录音、隐私与同意','明确告知、授权、访问和保留规则。')],[E('摘要与决策提取','区分讨论观点、已定决策、风险和待办。'),E('行动项确认','校验负责人、截止时间、依赖和原话。')],[E('同步任务与知识系统','将确认内容写入项目和知识工具。'),E('回顾会议质量','监控行动完成率、重复讨论和信息遗漏。')],['用一次真实会议测试 AI 纪要并统计纠错项。','设计会议纪要模板和参会者确认流程。'],[R.nist,R.map]),
'l5-learning':P('L5','AI 学习与知识获取','把 AI 作为会追问、出题和反馈的导师，而不是只会生成摘要的答案机。','持续进行',[E('学习目标与知识地图','定义要会解释、应用还是创造，并拆成子能力。'),E('苏格拉底式对话','让 AI 先追问与诊断，不直接给完整答案。')],[E('主动回忆与间隔复习','用测验、闪卡和复述强化记忆。'),E('案例迁移与纠错','把概念应用到陌生问题并分析错误原因。')],[E('产出驱动学习','通过文章、方案、Demo 或教学检验理解。'),E('来源核验与知识沉淀','对重要知识回到原始资料并维护个人笔记。')],['选择一个主题，完成七天“学习—测验—迁移—复盘”。','录制五分钟讲解，找出无法清楚说明的三个缺口。'],[R.map,R.quiz]),
'l5-decision':P('L5','AI 决策辅助','利用 AI 扩展选项、证据和反方观点，但保留价值权重、责任和最终判断。','1 周',[E('决策问题与边界','明确目标、期限、可逆性、责任和不可接受结果。'),E('标准与权重','把模糊偏好转成显式评价维度。')],[E('选项生成与证据','要求多方案、依据、假设和缺失信息。'),E('反事实与预演','测试关键假设、最坏情况和二阶影响。')],[E('人类价值判断','纳入组织语境、利益相关者和难量化因素。'),E('决策日志与复盘','记录当时证据、信心和触发重新评估的条件。')],['为一个真实决策制作选项—证据—权重矩阵。','三十天后复盘结果，区分信息错误、判断错误和执行错误。'],[R.nist,R.map]),
'l6-media':P('L6','AI 自媒体内容创作','建立有明确受众、原创价值、稳定生产和数据复盘的内容商业系统。','2–4 周',[E('定位、受众与价值主张','选择具体人群、问题和差异化视角。'),E('选题与证据库','从真实经验、数据和一手来源建立素材资产。')],[E('人机内容工作流','AI 辅助研究、结构和变体，人负责观点、事实和编辑。'),E('多渠道再利用','把一个核心内容适配图文、短视频、播客和邮件。')],[E('增长与转化漏斗','连接触达、互动、订阅、线索和收入。'),E('版权与平台治理','管理素材权利、AI 标识、事实风险和账号信誉。')],['连续两周发布同一主题内容并记录漏斗数据。','建立一份品牌语气、事实核验和版权检查清单。'],[R.pg,R.nist]),
'l6-tools':P('L6','AI 工具开发（无代码/低代码）','从真实痛点出发，用低代码和 AI 快速交付可付费的小工具。','2–4 周',[E('问题访谈与最小范围','验证频次、损失、替代方案和付费意愿。'),E('数据、模型与工作流','画清输入、处理、存储、输出和失败路径。')],[E('低代码 MVP','完成核心任务、账户/数据和基础错误处理。'),E('质量、安全与成本','建立评测、权限、隐私和用量限制。')],[E('试用与付费验证','招募目标用户，观察留存和实际支付。'),E('部署与支持','准备监控、反馈、文档、退款和版本迭代。')],['访谈五位用户并获得至少一个明确试用承诺。','上线一个只解决单一任务的 MVP，记录十次真实使用。'],[R.dc,R.dsh]),
'l6-consulting':P('L6','AI 咨询与培训','把个人经验产品化为有边界、有证据、可验收的咨询或培训服务。','2–4 周',[E('客户细分与问题诊断','选择行业、角色和高价值问题，避免泛化“教 AI”。'),E('方法论与服务边界','定义输入、过程、交付、客户责任和不承诺事项。')],[E('诊断与工作坊设计','用访谈、流程盘点和场景优先级形成共识。'),E('课程与练习','以真实任务、实操和反馈而非工具演示组织内容。')],[E('验收与效果评估','定义能力提升、采用、业务结果和后续支持。'),E('案例与转介绍','获得授权后沉淀证据、模板和复购产品。')],['制作一份针对具体岗位的 90 分钟 AI 工作坊。','为一个模拟客户完成场景诊断、路线图和报价。'],[R.nist,R.map]),
'l6-digital-human':P('L6','AI 数字人 / 虚拟主播','理解形象、声音、内容、实时驱动和合规，构建可信且有商业价值的数字人服务。','2–4 周',[E('产品类型与场景','区分预录、实时、交互式数字人的能力与成本。'),E('形象、声音与权利','处理肖像、声音授权、素材来源和使用范围。')],[E('内容与生成管线','组织脚本、语音、口型、视频、审核和发布。'),E('实时体验与兜底','控制延迟、打断、错误回答和人工接管。')],[E('透明度与滥用防护','提供 AI 标识、水印、身份校验和敏感场景限制。'),E('商业指标','衡量观看、互动、转化、制作成本和风险事件。')],['制作一分钟数字人样片并完成权利与标识清单。','设计一个实时数字人客服的延迟、失败和人工接管流程。'],[R.eu,R.nist]),
'l6-data-service':P('L6','AI 数据标注与微调服务','把数据采集、标注、质检和模型定制变成可审计、可复现的专业服务。','3–5 周',[E('任务与标注本体','定义标签、边界、例外和正反例。'),E('数据权利与安全','确认来源、授权、隐私、跨境和保留要求。')],[E('标注流程与一致性','设计培训、双标、仲裁和一致性指标。'),E('数据版本与切分','避免泄漏，记录来源、变更和训练/评测用途。')],[E('微调与基线比较','在同一评测集比较原模型、Prompt/RAG 和微调。'),E('交付与复现','提供数据卡、模型卡、评测、限制和删除机制。')],['为一个分类任务编写可执行标注指南并试标 50 条。','输出一份包含成本、质量门槛和风险的数据服务方案。'],[R.nist,R.pg]),
'l6-saas-agent':P('L6','AI 自动化服务（SaaS + Agent）','将 Agent 封装成可靠、可计费、可支持的持续服务，而不只是一次性 Demo。','3–6 周',[E('垂直任务与单位价值','选择边界明确、频次稳定且客户愿意付费的结果。'),E('SaaS 与 Agent 架构','设计租户、数据、模型、工具、队列和人工运营。')],[E('可靠性与权限','实现评测、审批、幂等、回滚、审计和隔离。'),E('计费与单位经济','计算每个成功任务的推理、工具、人工和失败成本。')],[E('试点与客户成功','从少量设计伙伴验证采用、结果和支持负担。'),E('规模化运营','建立 SLA、监控、版本、套餐、限额和事故响应。')],['制作每成功任务收入、成本和毛利的单位经济表。','设计一个含审批、回滚和审计的 SaaS Agent 核心流程。'],[R.dsh,R.nist,R.quiz])

const colors={L1:['#4f46e5','rgba(79,70,229,.08)'],L2:['#0891b2','rgba(8,145,178,.08)'],L3:['#d97706','rgba(217,119,6,.08)'],L4:['#059669','rgba(5,150,105,.08)'],L5:['#db2777','rgba(219,39,119,.08)'],L6:['#ea580c','rgba(234,88,12,.08)']};
const phaseNames=['L1 概念认知','L2 方法实践','L3 业务交付'];
const q=new URLSearchParams(location.search);let id=q.get('skill');if(id==='l2-agent')location.replace('ai-agent-learning-path.html');if(!paths[id])id='l1-history';const data=paths[id],all=data.phases.flat(),storeKey='ai-capability-path-'+id;let saved={};try{saved=JSON.parse(localStorage.getItem(storeKey))||{}}catch(e){}
const $=x=>document.getElementById(x),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bars(n){return Array.from({length:n},()=>'<span class="seg"></span>').join('')}
function route(target){return target==='l2-agent'?'ai-agent-learning-path.html':'ai-capability-learning-path.html?skill='+target}
function render(){const [color,soft]=colors[data.layer];document.documentElement.style.setProperty('--layer',color);document.documentElement.style.setProperty('--layer-soft',soft);document.title=data.title+' — 专项学习路径';$('label').textContent=data.layer+' · 专项学习路径';$('title').textContent=data.title;$('desc').textContent=data.desc;$('meta').innerHTML=`<span>${esc(data.weeks)}</span><span>3 阶段</span><span>${all.length} 个检查点</span><span>进度本地保存</span>`;$('totalBar').innerHTML=bars(all.length);$('layers').innerHTML=data.phases.map((phase,p)=>`<section class="layer"><div class="layer-head"><span class="badge">${phaseNames[p]}</span><span class="layer-count" id="count${p}">0/${phase.length}</span></div><div class="bar" id="bar${p}">${bars(phase.length)}</div>${phase.map((x,i)=>{const key=p+'-'+i;if(id==='l2-prompt'){return `<div class="item item-detail" data-key="${key}"><span class="check" aria-hidden="true"></span><div class="item-copy"><div class="item-title">${esc(x.title)}</div><div class="item-desc">${esc(x.desc)}</div><div class="item-meta"><span class="item-time">预计 30–60 分钟</span><span class="item-time">完成：自测 2/3 + 交付物</span><span class="item-status">未完成</span></div></div><a class="item-link" href="ai-capability-checkpoint.html?skill=l2-prompt&amp;checkpoint=${key}" aria-label="学习${esc(x.title)}">进入学习 →</a></div>`}return `<div class="item" data-key="${key}"><span class="check"></span><div><div class="item-title">${esc(x.title)}</div><div class="item-desc">${esc(x.desc)}</div></div></div>`}).join('')}</section>`).join('');$('tasks').innerHTML=data.tasks.map((x,i)=>`<div class="task"><div class="task-title">T${i+1}. PRACTICE</div><p>${esc(x)}</p></div>`).join('');$('resources').innerHTML=[...data.resources,[data.layer+' 分层测验','ai-capability-quiz.html?layer='+data.layer.toLowerCase()]].map(x=>`<a href="${x[1]}"${x[1].startsWith('http')?' target="_blank" rel="noopener"':''}>${esc(x[0])} →</a>`).join('');const idx=catalog.findIndex(x=>x[0]===id),prev=catalog[(idx-1+catalog.length)%catalog.length],next=catalog[(idx+1)%catalog.length];$('pager').innerHTML=`<a href="${route(prev[0])}">← 上一项<strong>${esc(prev[1])}</strong></a><a href="${route(next[0])}">下一项 →<strong>${esc(next[1])}</strong></a>`;bind();update()}
function bind(){document.querySelectorAll('.item').forEach(el=>{if(saved[el.dataset.key])el.classList.add('checked');if(id==='l2-prompt')return;el.addEventListener('click',()=>{el.classList.toggle('checked');saved[el.dataset.key]=el.classList.contains('checked');localStorage.setItem(storeKey,JSON.stringify(saved));update()})})}
function update(){let total=0;data.phases.forEach((phase,p)=>{const done=phase.filter((_,i)=>saved[p+'-'+i]).length;total+=done;$('count'+p).textContent=done+'/'+phase.length;$('bar'+p).querySelectorAll('.seg').forEach((x,i)=>x.classList.toggle('filled',i<done))});document.querySelectorAll('.item-detail').forEach(el=>{const done=!!saved[el.dataset.key];el.classList.toggle('checked',done);const status=el.querySelector('.item-status');if(status)status.textContent=done?'已完成':'未完成'});$('totalText').textContent=total+'/'+all.length;$('totalBar').querySelectorAll('.seg').forEach((x,i)=>x.classList.toggle('filled',i<total))}
$('reset').addEventListener('click',()=>{saved={};localStorage.removeItem(storeKey);if(id==='l2-prompt'){Object.keys(localStorage).filter(k=>k.startsWith('ai-capability-checkpoint-l2-prompt-')).forEach(k=>localStorage.removeItem(k))}document.querySelectorAll('.item').forEach(x=>x.classList.remove('checked'));update()});window.addEventListener('pageshow',()=>{try{saved=JSON.parse(localStorage.getItem(storeKey))||{}}catch(e){saved={}}document.querySelectorAll('.item').forEach(x=>x.classList.toggle('checked',!!saved[x.dataset.key]));update()});render();
</script>
</body>
</html>
